image: nixos/unstable
arch: x86_64
oauth: git.sr.ht/OBJECTS:RW git.sr.ht/REPOSITORIES:RO git.sr.ht/PROFILE:RO builds.sr.ht/JOBS:RW builds.sr.ht/SECRETS:RO meta.sr.ht/PROFILE:RO
environment:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: http.userAgent
  GIT_CONFIG_VALUE_0: "averagechris-fleet-pages (+https://averagechris.srht.site)"
  NIX_CONFIG: |
    experimental-features = nix-command flakes
    extra-substituters = https://averagechris-dotfiles.cachix.org
    extra-trusted-public-keys = averagechris-dotfiles.cachix.org-1:VwJkl5dG1+xGDY5x884mH/kVwwpgwBAdBKIF3BZiia4=
sources:
  - https://git.sr.ht/~averagechris/ctx
secrets:
  - 731f7e55-4497-4228-8fa4-1657da7d3625 # cachix averagechris-dotfiles -> ~/.ci_secrets/cachix_token
tasks:
  - release-artifact: |
      set -eu
      cd ctx
      nix build .#release-artifact --out-link result-release-artifact
      mkdir -p ~/artifacts
      cp -p result-release-artifact/* ~/artifacts/
  - cache-warm: |
      set -eu
      cd ctx
      if [ ! -f ~/.ci_secrets/cachix_token ]; then echo "no cachix token available; skipping cache warm"; exit 0; fi
      nix build .#ctx -o result-pkg
      CACHIX_AUTH_TOKEN="$(cat ~/.ci_secrets/cachix_token)"; export CACHIX_AUTH_TOKEN
      nix run --inputs-from . nixpkgs#cachix -- push averagechris-dotfiles result-release-artifact result-pkg
  - upload-and-refresh: |
      set -eu
      cd ctx
      export SRHT_TOKEN="${SRHT_TOKEN:-${OAUTH2_TOKEN:-$(awk '/access-token/ { gsub(/"/, "", $2); print $2; exit }' ~/.config/hut/config 2>/dev/null || true)}}"
      srht() { nix run 'git+https://git.sr.ht/~averagechris/srht' -- "$@"; }
      version="$(awk '/^\[package\]/{s=1} s && /^version = /{gsub(/"/,"",$3); print $3; exit}' crates/ctx-cli/Cargo.toml)"
      tag="v${version#v}"
      commit="$(git rev-parse HEAD)"

      set -- result-release-artifact/*.tar.gz
      [ -e "$1" ] || { printf '%s\n' 'no release artifacts found' >&2; exit 1; }
      for artifact do
        srht git artifact upload -r ctx --rev "$tag" "$artifact"
        srht git artifact upload -r ctx --rev "$tag" "$artifact.sha256"
      done

      manifest="$(mktemp)"
      cat > "$manifest" <<EOF
      image: nixos/unstable
      arch: x86_64
      oauth: pages.sr.ht/PAGES:RW
      environment:
        GIT_CONFIG_COUNT: "1"
        GIT_CONFIG_KEY_0: http.userAgent
        GIT_CONFIG_VALUE_0: "averagechris-fleet-pages (+https://averagechris.srht.site)"
        NIX_CONFIG: |
          experimental-features = nix-command flakes
          extra-substituters = https://averagechris-dotfiles.cachix.org
          extra-trusted-public-keys = averagechris-dotfiles.cachix.org-1:VwJkl5dG1+xGDY5x884mH/kVwwpgwBAdBKIF3BZiia4=
        TRIGGER_SOURCE: release
        TRIGGER_PROJECT: ctx
        TRIGGER_TAG: $tag
        TRIGGER_SHA: $commit
      sources:
        - https://git.sr.ht/~averagechris/averagechris.srht.site
      tasks:
        - refresh: |
            cd averagechris.srht.site
            nix run .#refresh-pages
      EOF
      srht builds submit "$manifest" --secrets --note "site refresh: ctx $tag"
artifacts:
  - artifacts/ctx-v1.0.1-x86_64-linux.tar.gz
  - artifacts/ctx-v1.0.1-x86_64-linux.tar.gz.sha256
